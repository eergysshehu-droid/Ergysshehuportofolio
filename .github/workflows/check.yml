name: Check portfolio

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: portfolio-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Astro and Cloudflare Worker
        run: npm run verify
